name: Daily Mirror & Deploy

on:
  schedule:
    - cron: "0 7 * * *"   # 7am UTC every day
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Push scripts to VPS and run mirror
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          VPS_HOST: 96.126.96.40
          VPS_PORT: 479
        run: |
          echo "$VPS_SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

          # Push latest scripts to VPS
          rsync -az \
            -e "ssh -p $VPS_PORT -i /tmp/deploy_key -o StrictHostKeyChecking=no" \
            scripts/ \
            root@$VPS_HOST:/opt/kp-mirror/scripts/

          # Run mirror + process + scan on the VPS (incremental, files already on disk)
          ssh -p $VPS_PORT -i /tmp/deploy_key -o StrictHostKeyChecking=no root@$VPS_HOST \
            "bash /opt/kp-mirror/scripts/mirror-and-deploy.sh"

          rm -f /tmp/deploy_key
