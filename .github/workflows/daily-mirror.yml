name: Daily Mirror & Deploy

on:
  schedule:
    - cron: "0 7 * * *"   # 7am UTC every day
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror-and-deploy:
    runs-on: ubuntu-latest
    # Backstop so a stuck mirror fails fast instead of burning the full 6h GH cap.
    timeout-minutes: 300

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Pre-flight — check if kylepounds.com is reachable from this runner
        id: preflight
        run: |
          if curl -sI -m 10 https://kylepounds.com -o /dev/null; then
            echo "reachable=true" >> "$GITHUB_OUTPUT"
            echo "kylepounds.com reachable from runner"
          else
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            echo "kylepounds.com unreachable from runner — will skip mirror, run VPS-only steps"
          fi

      # Mirror runs on the GitHub Actions runner (fresh IP each run — not the blocked VPS IP).
      - name: Mirror HTML/CSS on runner
        if: steps.preflight.outputs.reachable == 'true'
        run: |
          mkdir -p ./mirror-output
          # IMPORTANT: never recurse the site ROOT at depth>1. A single
          # "https://kylepounds.com/" at --level=3 crawls the ENTIRE site in one
          # wget — that's what hung the job for 6h (it never got past section 1).
          # Mirror the homepage shallow (level 1), then each section deep, and
          # hard-cap every section with `timeout` so one slow/looping section
          # can't eat the whole job. Format: "<level> <url>".
          SECTIONS=(
            "1 https://kylepounds.com/"
            "3 https://kylepounds.com/About%20Me/"
            "3 https://kylepounds.com/Education/"
            "3 https://kylepounds.com/News/"
            "3 https://kylepounds.com/Sports/"
            "3 https://kylepounds.com/Travel/"
          )
          PER_SECTION_CAP=2700   # 45 min hard ceiling per section
          CONSECUTIVE_FAILS=0
          for entry in "${SECTIONS[@]}"; do
            level="${entry%% *}"; url="${entry#* }"
            echo "  → (level $level) $url"
            if timeout "$PER_SECTION_CAP" wget \
                --recursive --level="$level" --no-parent \
                --accept="html,htm,css" \
                --timeout=20 --tries=2 \
                --wait=2 --random-wait \
                --limit-rate=200k \
                --user-agent="Mozilla/5.0 (compatible; kylepounds-mirror/2.1; +https://kylepounds.org)" \
                --directory-prefix=./mirror-output \
                -q "$url"; then
              CONSECUTIVE_FAILS=0
            else
              rc=$?
              if [ $rc -eq 124 ]; then
                echo "  ⏱ section hit ${PER_SECTION_CAP}s cap — partial content kept, moving on"
                CONSECUTIVE_FAILS=0   # a cap-hit isn't a connectivity failure
              else
                CONSECUTIVE_FAILS=$((CONSECUTIVE_FAILS + 1))
                echo "  ✗ section failed (wget exit $rc). Consecutive: $CONSECUTIVE_FAILS"
                if [ $CONSECUTIVE_FAILS -ge 2 ]; then
                  echo "  STOP — 2 consecutive failures; aborting mirror"
                  break
                fi
              fi
            fi
            sleep 15
          done
          echo "Mirror done: $(find ./mirror-output -name '*.html' -o -name '*.htm' 2>/dev/null | wc -l) HTML files"

      - name: Process HTML on runner
        if: steps.preflight.outputs.reachable == 'true'
        run: |
          DATE=$(date +%Y-%m-%d)
          SITE=./mirror-output/kylepounds.com
          python3 scripts/inject_noflash.py     "$SITE/"
          python3 scripts/fix_mixed_content.py  "$SITE/"
          python3 scripts/remove_basehref.py    "$SITE/"
          python3 scripts/inject_viewport.py    "$SITE/"
          python3 scripts/wrap_nav.py           "$SITE/"
          python3 scripts/strip_trackers.py     "$SITE/"
          python3 scripts/inject_banner.py      "$SITE/" "$DATE"
          python3 scripts/inject_fonts.py       "$SITE/"
          python3 scripts/fix_image_src.py      "$SITE/"

      - name: Push processed mirror to VPS
        if: steps.preflight.outputs.reachable == 'true'
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          VPS_HOST: 96.126.96.40
          VPS_PORT: 479
        run: |
          echo "$VPS_SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          # Safety: a partial/blocked mirror must NOT --delete the live archive.
          # Only sync with --delete when the mirror looks complete; otherwise
          # deploy additively (refresh/add only) so the served site never shrinks.
          COUNT=$(find ./mirror-output/kylepounds.com -name '*.html' -o -name '*.htm' 2>/dev/null | wc -l)
          echo "Mirrored $COUNT HTML files"
          if [ "$COUNT" -ge 1500 ]; then
            DELETE_FLAG="--delete"
            echo "Mirror looks complete — syncing with --delete"
          else
            DELETE_FLAG=""
            echo "⚠ Only $COUNT pages (likely partial/blocked) — additive sync, NO --delete, to protect the archive"
          fi
          rsync -az $DELETE_FLAG \
            -e "ssh -p $VPS_PORT -i /tmp/deploy_key -o StrictHostKeyChecking=no" \
            ./mirror-output/kylepounds.com/ \
            root@$VPS_HOST:/var/www/kylepounds.org/kylepounds.com/
          rm -f /tmp/deploy_key

      - name: Push scripts + run VPS-only steps (fonts, ingest, scan)
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          VPS_HOST: 96.126.96.40
          VPS_PORT: 479
        run: |
          echo "$VPS_SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          SSH_OPTS="-p $VPS_PORT -i /tmp/deploy_key -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=20"

          # Always push latest scripts (needed for fonts + manual VPS runs)
          rsync -az \
            -e "ssh -p $VPS_PORT -i /tmp/deploy_key -o StrictHostKeyChecking=no" \
            scripts/ root@$VPS_HOST:/opt/kp-mirror/scripts/

          # Run VPS-only steps: rebuild fonts.css, kp-ingest, trigger scan
          ssh $SSH_OPTS root@$VPS_HOST "bash /opt/kp-mirror/scripts/vps-post-deploy.sh"

          rm -f /tmp/deploy_key
